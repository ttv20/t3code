name: Build patched T3

on:
  push:
    branches: [patched]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_linux_x64:
    if: github.repository == 'ttv20/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ github.sha }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      T3CODE_WEB_SOURCEMAP: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: release
        name: Identify build
        shell: bash
        run: |
          base=$(node -p "require('./apps/server/package.json').version")
          version=$(node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.stdout.write(`${a}.${b}.${c+1}`)' "$base")
          version="${version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Stamp release version
        run: node scripts/update-release-package-versions.ts "${{ steps.release.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install desktop build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build web, server, and desktop bundle
        run: vp run build:desktop

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml

      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build self-contained archive
        shell: bash
        run: |
          resource_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$resource_dir"
          cp native/resource-monitor/target/release/t3-resource-monitor "$resource_dir/t3-resource-monitor"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ steps.release.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          cd release-cli
          sha256sum t3-*.tar.gz > SHA256SUMS

      - name: Smoke-test archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "${{ steps.release.outputs.version }}"

      - name: Build npm and Bun installable package
        shell: bash
        run: |
          node scripts/build-npm-platform-packages.ts \
            --archives-dir release-cli \
            --version "${{ steps.release.outputs.version }}" \
            --output-dir release-npm \
            --allow-missing --standalone
          cp release-npm/*.tgz release-cli/
          cd release-cli
          sha256sum t3-*.tar.gz t3-*.tgz > SHA256SUMS

      - name: Smoke-test npm package in an isolated prefix
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/t3-npm-smoke"
          npm install --global --prefix "$prefix" --cache "$RUNNER_TEMP/t3-npm-cache" \
            --offline --ignore-scripts --no-audit --no-fund release-cli/*.tgz
          "$prefix/bin/t3" --version | grep -Fx "${{ steps.release.outputs.version }}"
          test -f "$prefix/lib/node_modules/t3/runtime/client/index.html"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Smoke-test Bun package in an isolated prefix
        shell: bash
        env:
          BUN_INSTALL_GLOBAL_DIR: ${{ runner.temp }}/t3-bun-smoke/global
          BUN_INSTALL_BIN: ${{ runner.temp }}/t3-bun-smoke/bin
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/t3-bun-smoke/cache
        run: |
          bun add --global --ignore-scripts --no-progress --registry http://127.0.0.1:1 release-cli/*.tgz
          "$BUN_INSTALL_BIN/t3" --version | grep -Fx "${{ steps.release.outputs.version }}"
          test -f "$BUN_INSTALL_GLOBAL_DIR/node_modules/t3/runtime/client/index.html"

      - name: Upload Linux CLI archive for Windows WSL support
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/t3-*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish personal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          notes="Personal patched nightly based on upstream T3 Code. Linux x64 self-contained CLI archive and npm/Bun-installable package with the web UI. Desktop installers are added after their builds finish. Anonymous product analytics are disabled by default."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-cli/* --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "Patched T3 $version" --notes "$notes" --prerelease
          else
            gh release create "$tag" release-cli/* --target "$GITHUB_SHA" --title "Patched T3 $version" --notes "$notes" --prerelease
          fi

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [build_linux_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_linux_x64.outputs.version }}
      ref: ${{ needs.build_linux_x64.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: false

  desktop_windows_x64:
    name: Desktop Windows x64
    needs: [build_linux_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_linux_x64.outputs.version }}
      ref: ${{ needs.build_linux_x64.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false

  publish_desktop:
    name: Publish desktop clients
    needs: [build_linux_x64, desktop_linux_x64, desktop_windows_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' && needs.desktop_linux_x64.result == 'success' && needs.desktop_windows_x64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download desktop clients
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-desktop
          merge-multiple: true

      - name: Restore Windows updater manifest name
        shell: bash
        run: |
          shopt -s nullglob
          for manifest in release-desktop/*-win-x64.yml; do
            mv "$manifest" "${manifest%-win-x64.yml}.yml"
          done

      - name: Add desktop clients to personal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.build_linux_x64.outputs.tag }}"
          version="${{ needs.build_linux_x64.outputs.version }}"
          notes="Personal patched nightly based on upstream T3 Code. Includes a Linux x64 self-contained CLI, a directly installable npm/Bun .tgz with the web UI, Linux x64 desktop packages, and an unsigned Windows x64 desktop installer. Install the .tgz from this release with bun add --global <asset-url> or npm install --global <asset-url>. No upstream T3 package is fetched. Anonymous product analytics are disabled by default."
          gh release upload "$tag" release-desktop/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --title "Patched T3 $version" --notes "$notes" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"

name: Build patched T3

on:
  push:
    branches: [patched]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: fork-build-${{ github.ref }}
  # Finish signing and uploading the current release before building newer fixes.
  cancel-in-progress: false

jobs:
  build_linux_x64:
    if: github.repository == 'ttv20/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ github.sha }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      T3CODE_WEB_SOURCEMAP: "false"
      T3CODE_POSTHOG_KEY: ${{ secrets.T3CODE_POSTHOG_KEY }}
      T3CODE_POSTHOG_HOST: ${{ vars.T3CODE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
      T3CODE_TELEMETRY_ENABLED: ${{ vars.T3CODE_TELEMETRY_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: release
        name: Identify build
        shell: bash
        run: |
          base=$(node -p "require('./apps/server/package.json').version")
          version=$(node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.stdout.write(`${a}.${b}.${c+1}`)' "$base")
          version="${version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Stamp release version
        run: node scripts/update-release-package-versions.ts "${{ steps.release.outputs.version }}"

      - name: Write changes since the previous published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, RELEASE_VERSION: version, RUNNER_TEMP: temp } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8' }).trim();
          const previous = JSON.parse(gh('release', 'view', '--repo', repo, '--json', 'tagName')).tagName;
          const commits = gh('api', '--paginate', `repos/${repo}/compare/${previous}...${sha}?per_page=100`, '--jq', '.commits[] | {sha, message: .commit.message} | @json').split('\n').filter(Boolean).map(line => JSON.parse(line));
          const changes = [];
          let changesLength = 0;
          for (const commit of commits) {
            const title = commit.message.trim().split('\n')[0].slice(0, 200);
            const entry = `- ${title} ([${commit.sha.slice(0, 7)}](https://github.com/${repo}/commit/${commit.sha}))`;
            // GitHub release bodies are limited to 125,000 characters.
            if (changesLength + entry.length + 2 > 100_000) break;
            changes.push(entry);
            changesLength += entry.length + 2;
          }
          if (changes.length < commits.length) {
            changes.push(`See the full comparison below for ${commits.length - changes.length} more commits.`);
          }
          const notes = [
            `# T3 Code RTL ${version}`,
            '## Changes',
            changes.join('\n\n') || `Rebuilt commit ${sha}; no source changes since ${previous}.`,
            `[Full comparison](https://github.com/${repo}/compare/${previous}...${sha})`,
            '## Downloads',
            'Choose the installer or archive for your platform. npm packages are GitHub release assets: use npm install --global <matching-tarball-url>. Linux also supports Bun. Desktop and Android assets are attached as their builds finish; only attached files are available.',
            'Windows EXEs are unsigned unless Azure signing credentials are configured. macOS builds are unsigned and not notarized. Android APKs use the fork signing key. Set T3CODE_TELEMETRY_ENABLED=false at runtime to disable configured analytics.',
          ].join('\n\n') + '\n';
          writeFileSync(join(temp, 'fork-release-notes.md'), notes);
          NODE

      - name: Save release notes for desktop publication
        uses: actions/upload-artifact@v7
        with:
          name: fork-release-notes
          path: ${{ runner.temp }}/fork-release-notes.md
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install desktop build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build web, server, and desktop bundle
        run: vp run build:desktop

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml

      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build self-contained archive
        shell: bash
        run: |
          resource_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$resource_dir"
          cp native/resource-monitor/target/release/t3-resource-monitor "$resource_dir/t3-resource-monitor"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ steps.release.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          cd release-cli
          sha256sum t3-*.tar.gz > SHA256SUMS

      - name: Smoke-test archive
        env:
          T3CODE_TELEMETRY_ENABLED: "false"
        run: node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "${{ steps.release.outputs.version }}"

      - name: Build npm and Bun installable package
        shell: bash
        run: |
          node scripts/build-npm-platform-packages.ts \
            --archives-dir release-cli \
            --version "${{ steps.release.outputs.version }}" \
            --output-dir release-npm \
            --allow-missing --standalone
          cp release-npm/*.tgz release-cli/
          cd release-cli
          sha256sum t3-*.tar.gz t3-*.tgz > SHA256SUMS

      - name: Smoke-test npm package in an isolated prefix
        env:
          T3CODE_TELEMETRY_ENABLED: "false"
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/t3-npm-smoke"
          npm install --global --prefix "$prefix" --cache "$RUNNER_TEMP/t3-npm-cache" \
            --offline --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/release-cli/*.tgz
          "$prefix/bin/t3" --version | grep -Fx "t3 v${{ steps.release.outputs.version }}"
          test -f "$prefix/lib/node_modules/t3/runtime/client/index.html"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Smoke-test Bun package in an isolated prefix
        shell: bash
        env:
          BUN_INSTALL_GLOBAL_DIR: ${{ runner.temp }}/t3-bun-smoke/global
          BUN_INSTALL_BIN: ${{ runner.temp }}/t3-bun-smoke/bin
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/t3-bun-smoke/cache
        run: |
          bun add --global --ignore-scripts --no-progress --registry http://127.0.0.1:1 "$GITHUB_WORKSPACE"/release-cli/*.tgz
          "$BUN_INSTALL_BIN/t3" --version | grep -Fx "t3 v${{ steps.release.outputs.version }}"
          test -f "$BUN_INSTALL_GLOBAL_DIR/node_modules/t3/runtime/client/index.html"

      - name: Add a stable npm download name
        shell: bash
        run: |
          cp release-cli/t3-*-linux-x64.tgz release-cli/t3-linux-x64.tgz
          cd release-cli
          sha256sum t3-*.tar.gz t3-*.tgz > SHA256SUMS

      - name: Upload Linux CLI archive for Windows WSL support
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/t3-*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish personal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-cli/* --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "T3 Code RTL $version" --notes-file "$RUNNER_TEMP/fork-release-notes.md" --prerelease
          else
            gh release create "$tag" release-cli/* --target "$GITHUB_SHA" --title "T3 Code RTL $version" --notes-file "$RUNNER_TEMP/fork-release-notes.md" --prerelease
          fi

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [build_linux_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_linux_x64.outputs.version }}
      ref: ${{ needs.build_linux_x64.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: false

  desktop_windows_x64:
    name: Desktop Windows x64
    needs: [build_linux_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.build_linux_x64.outputs.version }}
      ref: ${{ needs.build_linux_x64.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      standalone_npm: true

  desktop_macos:
    name: Desktop macOS ${{ matrix.arch }}
    needs: [build_linux_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - arch: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build_linux_x64.outputs.version }}
      ref: ${{ needs.build_linux_x64.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: mac
      target: dmg
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: false

  android:
    name: Android APK
    needs: [build_linux_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' }}
    uses: ./.github/workflows/fork-android.yml
    secrets: inherit
    with:
      ref: ${{ needs.build_linux_x64.outputs.ref }}
      version: ${{ needs.build_linux_x64.outputs.version }}
      version_code: "${{ github.run_number }}"
      tag: ${{ needs.build_linux_x64.outputs.tag }}

  publish_macos:
    name: Publish macOS clients
    needs: [build_linux_x64, desktop_macos]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' && needs.desktop_macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download macOS clients
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-mac-*
          path: release-macos
          merge-multiple: true

      - name: Add macOS clients to personal release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_linux_x64.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-macos/*.dmg release-macos/*.zip release-macos/*-mac*.yml release-macos/*.blockmap)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish_desktop:
    name: Publish desktop clients
    needs: [build_linux_x64, desktop_linux_x64, desktop_windows_x64]
    if: ${{ !cancelled() && needs.build_linux_x64.result == 'success' && needs.desktop_linux_x64.result == 'success' && needs.desktop_windows_x64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: fork-release-notes
          path: release-metadata

      - name: Download Linux desktop client
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64
          path: release-desktop

      - name: Download Windows desktop client
        uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: release-desktop

      - name: Restore Windows updater manifest name
        shell: bash
        run: |
          shopt -s nullglob
          for manifest in release-desktop/*-win-x64.yml; do
            mv "$manifest" "${manifest%-win-x64.yml}.yml"
          done

      - name: Download Windows CLI archive
        uses: actions/download-artifact@v8
        with:
          name: cli-win-x64
          path: release-desktop

      - name: Download Windows npm package
        uses: actions/download-artifact@v8
        with:
          name: npm-win-x64
          path: release-desktop

      - name: Add desktop clients to personal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.build_linux_x64.outputs.tag }}"
          version="${{ needs.build_linux_x64.outputs.version }}"
          gh release upload "$tag" release-desktop/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --title "T3 Code RTL $version" --notes-file release-metadata/fork-release-notes.md --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
